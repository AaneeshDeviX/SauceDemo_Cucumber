# Full UI suite. Manual / scheduled only — NOT a push gate.
#
# 25 of 51 scenarios currently fail against the live site because SauceDemo moved
# its add-to-cart buttons from `id="add-to-cart-*"` to `data-test` attributes, and
# the burger-menu locator now resolves to an <img> covered by
# `#react-burger-menu-btn`. Both are tracked in the README under "Current status".
# This workflow stays out of the push path until those locators are updated, so
# the repository badge never reports a green build over a broken suite.

name: UI Tests (full suite)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 1'

jobs:
  test:
    name: Selenium + Cucumber (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run suite
        run: mvn -B test -Dheadless=true -Drecord.video=false

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/cucumber-reports/
            reports/
            screenshots/
            target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore
